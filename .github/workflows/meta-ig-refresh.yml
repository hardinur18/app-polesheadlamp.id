name: Meta IG Token Refresh

on:
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:

jobs:
  refresh_instagram_token:
    name: Refresh Instagram Token
    runs-on: ubuntu-latest
    concurrency:
      group: meta-ig-refresh
      cancel-in-progress: false

    permissions:
      contents: read

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      META_IG_STATE_KEY: meta:instagram:token:rhi-system

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh Instagram token from server state
        run: npm run meta:ig-refresh:server

      - name: Publish summary
        if: always()
        run: |
          echo "### Meta IG refresh" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scheduler: GitHub Actions" >> "$GITHUB_STEP_SUMMARY"
          echo "- State source: Supabase KV \`meta:instagram:token:rhi-system\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Secret sync target: Supabase project \`${SUPABASE_PROJECT_REF}\`" >> "$GITHUB_STEP_SUMMARY"
