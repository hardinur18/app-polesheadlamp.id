name: Cloudflare Pages Delivery

on:
  push:
    branches: [main, development]
  workflow_dispatch:

jobs:
  retire_old_application:
    if: github.repository == 'hardinur18/app-polesheadlamp.id'
    runs-on: ubuntu-latest
    concurrency:
      group: production-pages-deploy
      cancel-in-progress: false
    environment:
      name: production
      url: https://polesheadlamp-id.pages.dev
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test retirement redirect and service worker
        run: node scripts/test-retirement.mjs
      - name: Prepare redirect-only delivery
        run: mkdir -p dist && cp retirement/_worker.js retirement/index.html dist/
      - name: Close legacy Pages application
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=polesheadlamp-id --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
